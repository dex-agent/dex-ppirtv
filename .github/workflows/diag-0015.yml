name: diag-0015

# ISSUE-LOCAL-0015 (Trilho 2026-11-21-issue0015, task A-01): probe de
# diagnóstico da divergencia cross-platform da validacao legacy de review.
# workflow_dispatch proposital (nao e required check; nao polui a barra da
# main). Descartavel: removido no corte da cura (task A-03).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/diagnose-0015.mjs
