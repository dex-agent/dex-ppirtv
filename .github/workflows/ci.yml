name: CI

# P1 da auditoria GitHub (2026-11-19, GO do dono ao veredito do $oraculo-solid
# — Viscosidade do ambiente, whitepaper PT l.11476): os 6 gates da casa eram
# todos locais; este workflow os torna barreira server-side para push/PR.
#
# LACUNA DECLARADA (primeira instalação): o CI roda o SUBCONJUNTO
# determinista (build + types + suíte completa). Ficam de fora, por
# dependerem de estado da máquina local: audit:canonical (lê contratos
# globais em ~/.agents/contracts — não viajam no clone) e check:capacity /
# check:flow-engine em modo worktree. A lapidação de cobertura total é item
# de fila próprio; a barreira mínima (1018+ testes, typecheck, build) já
# elimina o push/PR sem NENHUM check.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # LACUNA DECLARADA (2ª, medida no 1º run 44502062854): 3 testes são
    # Windows-bound — "keeps the living architecture public and discoverable"
    # lê AGENTS.md (gitignored por design, viaja via PLAYBOOK), o it de
    # case-equivalent L1 depende de FS case-insensitive, e o fail-closed
    # pre-upgrade review diverge no Linux. A frota da casa é Windows-first:
    # runner Windows mantém a suíte INTEGRAL como barreira; portabilidade
    # Linux dos 3 é item de lapidação própria (não esconder: fila).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Testes E2E e corroboração git leem história — checkout completo.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:types
      - run: npm test
      # Janela de fechamento #21 (CI lapidado): a barra também confere a
      # ESTRUTURA dos contratos canônicos locais (--local-only — o runner não
      # tem ~/.agents; sincronia plena continua no audit:canonical da frota)
      # e a forma/aritmética do par CAPACITY versionado no checkout.
      - run: node scripts/audit-canonical-sync.mjs --local-only
      - run: node scripts/check-capacity.mjs
